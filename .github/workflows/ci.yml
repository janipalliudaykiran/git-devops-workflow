name: Python CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Run Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
          

      - name: Run tests
        run: python -m pytest

      
      - name: Build Docker image
        run: docker build --tag devops-python-app:ci .

      - name: Test hardened Docker container
        shell: bash
        run: |
          output="$(docker run --rm \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            devops-python-app:ci)"

          printf '%s\n' "$output"
          test "$output" = "Hello from my DevOps application!"

          user="$(docker image inspect devops-python-app:ci --format='{{.Config.User}}')"
          test "$user" = "appuser"

          echo "Container smoke test and non-root check passed."


