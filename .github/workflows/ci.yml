
name: Python CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Run Python Tests
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

      - name: Build Docker image
        run: docker build --tag devops-python-app:ci .

      
      - name: Test hardened Docker container
        shell: bash
        run: |
          set -euo pipefail

          container_name=devops-python-ci

          cleanup() {
            docker rm -f "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d \
            --name "$container_name" \
            -p 127.0.0.1:8080:8000 \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            devops-python-app:ci

          health=""
          for attempt in {1..15}; do
            health="$(docker inspect --format='{{.State.Health.Status}}' "$container_name")"

            if [ "$health" = "healthy" ]; then
              break
            fi

            if [ "$health" = "unhealthy" ]; then
              docker logs "$container_name"
              exit 1
            fi

            sleep 2
          done

          health="$(docker inspect --format='{{.State.Health.Status}}' "$container_name")"
          if [ "$health" != "healthy" ]; then
            docker logs "$container_name"
            echo "Container did not become healthy."
            exit 1
          fi

          output="$(curl --fail --silent http://127.0.0.1:8080/)"
          printf '%s\n' "$output"
          test "$output" = "Hello from my DevOps application!"

          health_body="$(curl --fail --silent http://127.0.0.1:8080/health)"
          test "$health_body" = "ok"

          user="$(docker image inspect devops-python-app:ci --format='{{.Config.User}}')"
          test "$user" = "appuser"

          echo "HTTP endpoints, health check, and non-root configuration passed."


      - name: Save tested Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save --output devops-python-app.tar devops-python-app:ci

      - name: Upload tested Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: devops-python-app-image
          path: devops-python-app.tar
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish Image to Amazon ECR
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download tested Docker image
        uses: actions/download-artifact@v8
        with:
          name: devops-python-app-image

      - name: Load tested Docker image
        run: docker load --input devops-python-app.tar

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: GitHubActions-${{ github.run_id }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push tested image to ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}-${{ github.run_attempt }}
        run: |
          docker tag devops-python-app:ci "$REGISTRY/$REPOSITORY:$IMAGE_TAG"
          docker push "$REGISTRY/$REPOSITORY:$IMAGE_TAG"
          echo "Published image: $REGISTRY/$REPOSITORY:$IMAGE_TAG" >> "$GITHUB_STEP_SUMMARY"

  
  deploy:
    name: Deploy to Amazon ECS
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_ECS_DEPLOY == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ECS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: ECSDeploy-${{ github.run_id }}

      - name: Render task definition with the published image
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1.9.0
        with:
          task-definition: task-definition.json
          container-name: devops-python-app
          image: 232101830589.dkr.ecr.ap-south-1.amazonaws.com/devops-python-app:${{ github.sha }}-${{ github.run_attempt }}

      - name: Deploy to ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2.6.3
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: devops-python-app-service
          cluster: devops-lab-cluster
          wait-for-service-stability: true
          

