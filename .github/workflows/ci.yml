
name: Python CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Run Python Tests
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

      - name: Build Docker image
        run: docker build --tag devops-python-app:ci .

      - name: Test hardened Docker container
        shell: bash
        run: |
          output="$(docker run --rm \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            devops-python-app:ci)"

          printf '%s\n' "$output"
          test "$output" = "Hello from my DevOps application!"

          user="$(docker image inspect devops-python-app:ci --format='{{.Config.User}}')"
          test "$user" = "appuser"

          echo "Container smoke test and non-root check passed."

      - name: Save tested Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save --output devops-python-app.tar devops-python-app:ci

      - name: Upload tested Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: devops-python-app-image
          path: devops-python-app.tar
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish Image to Amazon ECR
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download tested Docker image
        uses: actions/download-artifact@v8
        with:
          name: devops-python-app-image

      - name: Load tested Docker image
        run: docker load --input devops-python-app.tar

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: GitHubActions-${{ github.run_id }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push tested image to ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}-${{ github.run_attempt }}
        run: |
          docker tag devops-python-app:ci "$REGISTRY/$REPOSITORY:$IMAGE_TAG"
          docker push "$REGISTRY/$REPOSITORY:$IMAGE_TAG"
          echo "Published image: $REGISTRY/$REPOSITORY:$IMAGE_TAG" >> "$GITHUB_STEP_SUMMARY"

