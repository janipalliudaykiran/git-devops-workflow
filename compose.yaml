services:
  web:
    image: python:3.13-slim
    command:
      - sh
      - -c
      - |
        mkdir -p /tmp/webroot
        echo "Hello from a health-checked service" > /tmp/webroot/index.html
        cd /tmp/webroot
        exec python -m http.server 8000 --bind 0.0.0.0
    ports:
      - "127.0.0.1:8080:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

  client:
    image: busybox:1.36
    depends_on:
      web:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        echo "Web service passed its health check."
        wget -qO- http://web:8000/
